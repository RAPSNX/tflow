name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published-module:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the published module from the proxy and verify its version
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          # The module proxy indexes a new tag shortly after the GitHub
          # Release is published, not necessarily instantly, and @latest can
          # keep resolving to the previous tag for a while after that. Retry
          # the install-then-verify pair together for a few minutes rather
          # than failing as soon as @latest resolves to a stale version.
          want="tflow ${GITHUB_REF_NAME}"
          for attempt in $(seq 1 10); do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rapsnx/tflow/cmd/tflow@latest; then
              got="$("$RUNNER_TEMP/bin/tflow" version)"
              echo "installed: $got"
              echo "expected:  $want"
              if [ "$got" = "$want" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "go install did not resolve to $want after $attempt attempts" >&2
              exit 1
            fi
            sleep 30
          done
