name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published-module:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the published module from the proxy and verify its version
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          # Install the exact pushed tag rather than @latest: Go's version
          # queries prefer release versions over prereleases, so @latest
          # would keep resolving to an existing stable release -- never the
          # tag this workflow just published -- for every prerelease tag
          # (e.g. v2.0.0-rc.1) pushed while a stable release exists,
          # deterministically exhausting every retry. The module proxy still
          # indexes a new tag shortly after the GitHub Release is published,
          # not necessarily instantly, so retry the install itself for a few
          # minutes rather than failing on the first miss.
          want="tflow ${GITHUB_REF_NAME}"
          for attempt in $(seq 1 10); do
            if GOBIN="$RUNNER_TEMP/bin" go install "github.com/rapsnx/tflow/cmd/tflow@${GITHUB_REF_NAME}"; then
              got="$("$RUNNER_TEMP/bin/tflow" version)"
              echo "installed: $got"
              echo "expected:  $want"
              if [ "$got" != "$want" ]; then
                echo "installed version does not match the pushed tag" >&2
                exit 1
              fi
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "go install did not resolve ${GITHUB_REF_NAME} after $attempt attempts" >&2
              exit 1
            fi
            sleep 30
          done
