name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Reject unsupported major-version tags
        run: |
          # The module path (github.com/rapsnx/tflow) has no /vN suffix, so
          # per Go's major-version-suffix rule, `go install .../tflow@v2.x.x`
          # can never resolve against it -- a v2+ tag would publish a
          # release whose own verify-published-module job is guaranteed to
          # fail. Fail fast here instead, before goreleaser runs.
          major="$(echo "$GITHUB_REF_NAME" | sed -n 's/^v\([0-9]\+\)\..*/\1/p')"
          if [ -z "$major" ]; then
            echo "tag $GITHUB_REF_NAME does not match vN.N.N; refusing to guess its major version" >&2
            exit 1
          fi
          # Compare as a string, not `[ "$major" -ge 2 ]`: a SemVer-valid
          # but astronomically large major version overflows shell integer
          # arithmetic ("integer expression expected"), and since that
          # failure happens inside an `if` condition, `bash -e` does not
          # treat it as fatal -- the tag would then incorrectly fall
          # through to goreleaser instead of being rejected. Strip leading
          # zeros first so "01" and "1" compare the same; case-matching a
          # string never overflows regardless of how many digits it has.
          stripped="$(echo "$major" | sed 's/^0*//')"
          case "$stripped" in
            ""|0|1) ;;
            *)
              echo "tag $GITHUB_REF_NAME is major version $major, but module path" >&2
              echo "github.com/rapsnx/tflow has no /v$major suffix -- go install would" >&2
              echo "never resolve it. Migrate the module path before tagging v2+." >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published-module:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the published module from the proxy and verify its version
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          # Install the exact pushed tag rather than @latest: Go's version
          # queries prefer release versions over prereleases, so @latest
          # would keep resolving to an existing stable release -- never the
          # tag this workflow just published -- for every prerelease tag
          # (e.g. v2.0.0-rc.1) pushed while a stable release exists,
          # deterministically exhausting every retry. The module proxy still
          # indexes a new tag shortly after the GitHub Release is published,
          # not necessarily instantly, so retry the install itself for a few
          # minutes rather than failing on the first miss.
          want="tflow ${GITHUB_REF_NAME}"
          for attempt in $(seq 1 10); do
            if GOBIN="$RUNNER_TEMP/bin" go install "github.com/rapsnx/tflow/cmd/tflow@${GITHUB_REF_NAME}"; then
              got="$("$RUNNER_TEMP/bin/tflow" version)"
              echo "installed: $got"
              echo "expected:  $want"
              if [ "$got" != "$want" ]; then
                echo "installed version does not match the pushed tag" >&2
                exit 1
              fi
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "go install did not resolve ${GITHUB_REF_NAME} after $attempt attempts" >&2
              exit 1
            fi
            sleep 30
          done
